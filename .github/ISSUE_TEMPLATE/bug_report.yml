---
name: Bug report
description: >-
  Report a reproducible CampusWeave problem without private tenant data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, customer exports, tenant identifiers, or
        device/user data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including exact non-sensitive errors.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        Minimal steps using the synthetic Reference University or synthetic
        fixtures.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or revision
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, Node.js, browser, and operating system versions.
