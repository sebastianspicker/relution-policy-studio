name: Feature request
description: Propose a scoped improvement to the studio or its documentation.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What were you trying to accomplish, and where did the workflow become
        unclear or inefficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior and its safety boundary.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and safety
      description: >-
        What must remain local-only or read-only, and what external system or
        data impact is expected?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: >-
            This proposal contains no credentials, customer data, or live
            target details.
          required: true
