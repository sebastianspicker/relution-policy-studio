---
name: CampusWeave CI

"on":
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: campusweave-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Install package
        run: python3 -m pip install --editable '.[dev]'
      - name: Install frontend tooling
        run: npm ci
      - name: Behavioral and architecture tests
        run: |
          ruff check .
          ruff format --check campusweave scripts tests
          pyright
          python3 -m unittest discover -s tests -v
          npm test
          npm run lint
      - name: Syntax and machine-contract validation
        run: |
          find web -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} +
          find campusweave scripts -type f -name '*.py' -exec python3 -m py_compile {} +
          python3 scripts/validate_machine_docs.py
          zsh -n scripts/relution_curl.zsh
