name: Relution Docker E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  relution-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker Relution E2E
        timeout-minutes: 20
        run: pnpm test:e2e:relution

      - name: Capture Docker logs
        if: always()
        run: |
          docker compose -p relution-policy-workbench-e2e -f docker-compose.relution-e2e.yml logs --no-color > relution-e2e.log || true

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relution-e2e-logs
          path: relution-e2e.log
          if-no-files-found: ignore
