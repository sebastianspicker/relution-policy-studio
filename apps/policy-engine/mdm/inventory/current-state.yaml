critical_inputs:
  - id: INV-SYS-001
    object: installed_relution_versions
    state: NOT_EVIDENCED
    acquire: Server, Portal, Companion, mobile clients, connectors, API/OpenAPI versions and build identifiers
    evidence: system metadata plus sanitised screenshots/API response
  - id: INV-SYS-002
    object: deployment_and_licensing
    state: NOT_EVIDENCED
    acquire: hosting model, enabled modules, licensed features, database, reverse proxy, backups and DR
  - id: INV-ORG-001
    object: organisations_and_boundaries
    state: NOT_EVIDENCED
    acquire: tenant/suborganisation hierarchy, delegated administration and data/trust boundaries
  - id: INV-IAM-001
    object: administrators_roles_and_accounts
    state: NOT_EVIDENCED
    acquire: sanitised admins, roles, permissions, IdP, MFA, break-glass, service/API accounts, last use
  - id: INV-GRP-001
    object: groups
    state: NOT_EVIDENCED
    acquire: name, type, membership rule/source, owner, members count, assignments, overlaps and last use
  - id: INV-DEV-001
    object: devices
    state: NOT_EVIDENCED
    acquire: pseudonymous ID, platform/build/model, ownership, enrolment/supervision, primary/shared use, encryption, patch, integrity, check-in, policy/app/certificate/compliance state
  - id: INV-POL-001
    object: policies_versions_and_assignments
    state: NOT_EVIDENCED
    acquire: known-good .rexp exports, settings, versions, groups, precedence, dependencies, dates, expected/effective state and errors
  - id: INV-APP-001
    object: applications_and_content
    state: NOT_EVIDENCED
    acquire: required/optional/prohibited apps, licences, configs, updates, permissions, data-sharing and owner
  - id: INV-PKI-001
    object: certificates_and_enrolment_services
    state: NOT_EVIDENCED
    acquire: CA/connectors/templates, purpose, issuer, expiry, renewal, revocation and escrow without key material
  - id: INV-CMP-001
    object: compliance_rules_and_exceptions
    state: NOT_EVIDENCED
    acquire: checks, thresholds, cadence, actions, notices, recovery, exceptions and expiry
  - id: INV-OPS-001
    object: logging_retention_backup_and_incident_process
    state: NOT_EVIDENCED
    acquire: audit events, retention/access review, backup/restore test, loss/wipe/offboarding and change records

