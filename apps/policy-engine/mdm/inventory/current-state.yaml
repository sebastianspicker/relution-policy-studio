collection_controls:
  - use read-only exports or API operations first
  - record query limit, total, truncation and collection timestamp
  - pseudonymise user and device identifiers before promotion to tracked files
  - never collect private keys, passwords, tokens, Wi-Fi secrets or personal app lists
  - distinguish configured, assigned, delivered, effective and verified states
  - hash and date every source export; retain originals only in private storage

