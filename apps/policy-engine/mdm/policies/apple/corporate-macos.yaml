schema_version: 1
policy_id: MAC-CORP-BASELINE-L1-LAB-v1
platform: MACOS
model: corporate_mac
ownership: corporate
enrollment_model: MACOS
layer: 1
purpose: baseline
status: active
evidence_status: REFERENCE_VALIDATED
minimum_os: NOT_EVIDENCED
controls: [MDM-AUTH-001, MDM-ENC-001, MDM-INT-001, MDM-UPD-001]
dependencies: []
environment_placeholders: []
settings:
  - configuration_type: IOS_PASSCODE
    values: {forcePIN: true, minLength: 12, requireAlphanumeric: true, maxInactivityMinutes: 15}
    control_ids: [MDM-AUTH-001]
  - configuration_type: MACOS_FILE_VAULT
    values: {enableRecoveryKeyEscrow: true}
    control_ids: [MDM-ENC-001]
  - configuration_type: MACOS_FIREWALL
    values: {enableFirewall: true, enableStealthMode: true, blockAllIncoming: false, allowSigned: true, allowSignedApp: true}
    control_ids: [MDM-INT-001]
  - configuration_type: MACOS_UPDATE
    values:
      updateMode: INSTALL_ASAP
      allowPreReleaseInstallation: false
      automaticCheckEnabled: true
      automaticDownload: true
      configDataInstall: true
      criticalUpdateInstall: true
    control_ids: [MDM-UPD-001]
rings: [LAB]
production_ready: false
