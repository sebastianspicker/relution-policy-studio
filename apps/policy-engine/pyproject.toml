# Configure the locked Python evidence-tool package and lint rules.
[project]
name = "rexp-studio-tools"
version = "0.1.0"
description = "Offline evidence and validation tools used by REXP Studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7,<1",
    "PyMuPDF>=1.27,<2",
]

[tool.uv]
required-version = "==0.10.7"

[tool.ruff]
target-version = "py311"

[tool.pylint.similarities]
min-similarity-lines = 12

[dependency-groups]
dev = [
    "ruff==0.14.14",
]
